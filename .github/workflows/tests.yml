name: Tests
permissions:
  contents: read

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    environment: production
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install uv
      uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      with:
        version: "latest"

    - name: Set up Python ${{ matrix.python-version }}
      run: uv python install ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        uv sync --all-extras --dev

    - name: Run linting
      run: |
        uv run ruff check .
        uv run ruff format --check .

    - name: Run type checking
      run: |
        uv run mypy src/rwreader --ignore-missing-imports
      continue-on-error: true  # Don't fail CI on type errors yet

    - name: Run tests
      env:
        # Use mock/test token to avoid hitting real API
        READWISE_TOKEN: "test_token_for_ci"
      run: |
        uv run pytest tests/ -v --tb=short --cov=rwreader --cov-report=xml --cov-report=term-missing -m "not integration"

    - name: Check coverage threshold
      run: |
        uv run pytest tests/ --cov=rwreader --cov-fail-under=10 --cov-report=term-missing -m "not integration"
