name: Tests
permissions:
  contents: read

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    environment: production
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      with:
        persist-credentials: false

    - name: Install uv
      uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      with:
        version: "latest"

    - name: Set up Python ${{ matrix.python-version }}
      run: uv python install ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        uv sync --all-extras --dev

    - name: Run linting
      run: |
        uv run ruff check .
        uv run ruff format --check .

    - name: Run type checking
      run: |
        uv run mypy src/rwreader --ignore-missing-imports
      continue-on-error: true  # Don't fail CI on type errors yet

    - name: Run tests
      env:
        # Use mock/test token to avoid hitting real API
        READWISE_TOKEN: "test_token_for_ci"
      run: |
        uv run pytest tests/ -v --tb=short --cov=rwreader --cov-report=xml --cov-report=term-missing -m "not integration"

    - name: Check coverage threshold
      run: |
        uv run pytest tests/ --cov=rwreader --cov-fail-under=10 --cov-report=term-missing -m "not integration"
